<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Meetly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-b from-pink-50/50 via-white to-slate-50 dark:from-[#090d16] dark:via-[#0c101d] dark:to-[#090d16] text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col justify-center items-center px-4 relative overflow-hidden transition-colors duration-200">
    
    <div class="max-w-md w-full relative z-10 my-8">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-pink-600 flex items-center justify-center text-white font-extrabold text-lg shadow-md shadow-pink-500/25 group-hover:scale-105 transition">
                    <span>M</span>
                </div>
                <span class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Meetly</span>
            </a>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-5">Reset your password</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Enter your new secure password below</p>
        </div>

        <div class="bg-white dark:bg-[#0d121f] border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-[0_15px_35px_rgba(37,99,235,0.08)] dark:shadow-2xl">
            <div id="alertMsg" class="hidden mb-5 p-3.5 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2.5"></div>

            <form id="resetPasswordForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required minlength="6"
                        class="w-full bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-900 focus:border-pink-600 focus:ring-2 focus:ring-pink-600/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6"
                        class="w-full bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-900 focus:border-pink-600 focus:ring-2 focus:ring-pink-600/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <button type="submit" id="submitBtn" class="w-full mt-2 bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-md shadow-pink-500/25 flex items-center justify-center gap-2">
                    <span>Update Password</span>
                </button>
            </form>

            <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
                Remember your password? <a href="/login" class="text-pink-600 dark:text-pink-400 hover:underline font-bold">Sign in</a>
            </p>
        </div>
    </div>

    <script>
        let supabaseClient = null;

        async function init() {
            try {
                const cfgRes = await fetch('/api/auth/config');
                const cfg = await cfgRes.json();
                supabaseClient = window.supabase.createClient(cfg.supabase_url, cfg.supabase_key);
            } catch (err) {
                console.error('Failed to init Supabase:', err);
            }
        }
        init();

        const form = document.getElementById('resetPasswordForm');
        const alertMsg = document.getElementById('alertMsg');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(msg, isSuccess = false) {
            alertMsg.className = `mb-5 p-3.5 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2.5 ${
                isSuccess 
                ? 'bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 text-emerald-700 dark:text-emerald-300'
                : 'bg-rose-50 dark:bg-rose-950/60 border border-rose-200 text-rose-700 dark:text-rose-300'
            }`;
            alertMsg.textContent = msg;
            alertMsg.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (pw !== confirm) {
                showAlert('Passwords do not match.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="inline-block animate-spin mr-2">⏳</span> Updating...';

            try {
                if (!supabaseClient) throw new Error('Supabase client not initialized.');
                const { data, error } = await supabaseClient.auth.updateUser({ password: pw });
                if (error) throw error;

                showAlert('Password updated successfully! Redirecting to login...', true);
                setTimeout(() => { window.location.href = '/login'; }, 2000);
            } catch (err) {
                showAlert(err.message || 'Failed to update password.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Update Password</span>';
            }
        });
    </script>
</body>
</html>
