<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Meetly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/js/supabase_auth.js?v=5.0"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-b from-pink-50/50 via-white to-slate-50 dark:from-[#090d16] dark:via-[#0c101d] dark:to-[#090d16] text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col justify-center items-center px-4 relative overflow-hidden transition-colors duration-200">
    
    <div class="absolute top-[-100px] right-[-100px] w-[500px] h-[500px] bg-pink-100/50 dark:bg-pink-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="absolute bottom-[-100px] left-[-100px] w-[500px] h-[500px] bg-indigo-50/60 dark:bg-indigo-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <div class="absolute top-6 right-6">
        <button id="themeToggleBtn" type="button" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 transition shadow-sm">
            <svg class="w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </div>

    <div class="max-w-md w-full relative z-10 my-8">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-pink-600 flex items-center justify-center text-white font-extrabold text-lg shadow-md shadow-pink-500/25 group-hover:scale-105 transition">
                    <span>M</span>
                </div>
                <span class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Meetly</span>
            </a>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-5">Welcome back</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Sign in to your meeting minutes workspace</p>
        </div>

        <div class="bg-white dark:bg-[#0d121f] border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-[0_15px_35px_rgba(37,99,235,0.08)] dark:shadow-2xl">
            <div id="clientAlert" class="hidden mb-5 p-3.5 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2.5">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span id="clientAlertText"></span>
            </div>

            {% if error %}
            <div id="serverAlert" class="mb-5 p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-900/70 text-rose-700 dark:text-rose-300 text-xs sm:text-sm font-semibold flex items-center gap-2.5">
                <svg class="w-4 h-4 shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form id="loginForm" action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                    <input type="email" id="loginEmail" name="email" placeholder="name@domain.com" required
                        class="w-full bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-900 focus:border-pink-600 focus:ring-2 focus:ring-pink-600/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Password</label>
                        <button type="button" id="forgotPasswordBtn" class="text-xs text-pink-600 dark:text-pink-400 hover:underline font-semibold transition cursor-pointer">Forgot Password?</button>
                    </div>
                    <input type="password" id="loginPassword" name="password" placeholder="••••••••" required
                        class="w-full bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-900 focus:border-pink-600 focus:ring-2 focus:ring-pink-600/10 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <button type="submit" id="loginSubmitBtn" class="w-full mt-2 bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-md shadow-pink-500/25 flex items-center justify-center gap-2">
                    <span id="loginBtnText">Sign In to Meetly</span>
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-slate-800"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white dark:bg-[#0d121f] px-3 text-slate-400 font-medium">Or continue with</span></div>
            </div>

            <button type="button" id="googleLoginBtn" class="w-full mb-3 bg-white dark:bg-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition font-medium py-2.5 rounded-xl text-sm flex items-center justify-center gap-2.5 shadow-sm cursor-pointer">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <a href="/login?guest=1" class="w-full bg-pink-50 dark:bg-pink-950/40 hover:bg-pink-100 dark:hover:bg-pink-900/40 text-pink-700 dark:text-pink-300 border border-pink-200/80 dark:border-pink-800 transition font-medium py-2.5 rounded-xl text-sm flex items-center justify-center gap-2">
                <svg class="w-4 h-4 text-pink-600 dark:text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>Instant Guest &bull; Demo Access</span>
            </a>

            <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
                Don't have an account? <a href="/signup" class="text-pink-600 dark:text-pink-400 hover:underline font-bold">Sign up</a>
            </p>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
        <div class="bg-white dark:bg-[#0d121f] rounded-2xl border border-slate-200 dark:border-slate-800 max-w-sm w-full p-6 shadow-2xl space-y-4">
            <div>
                <h3 class="text-base font-bold text-slate-900 dark:text-white">Recover Password</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">We'll send a secure password reset link to your email.</p>
            </div>
            <div id="forgotAlert" class="hidden p-3 rounded-xl text-xs font-semibold"></div>
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                <input type="email" id="forgotEmail" placeholder="name@domain.com"
                    class="w-full bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-900 focus:border-pink-600 focus:ring-2 focus:ring-pink-600/10 rounded-xl px-4 py-2 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none">
            </div>
            <div class="flex items-center justify-end gap-2.5 pt-2">
                <button type="button" id="cancelForgotBtn" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Cancel</button>
                <button type="button" id="sendForgotBtn" class="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-pink-600 hover:bg-pink-700 shadow-sm transition">Send Link</button>
            </div>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        const clientAlert = document.getElementById('clientAlert');
        const clientAlertText = document.getElementById('clientAlertText');
        const serverAlert = document.getElementById('serverAlert');
        const loginForm = document.getElementById('loginForm');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        function showMessage(msg, isSuccess = false) {
            if (serverAlert) serverAlert.classList.add('hidden');
            clientAlert.className = `mb-5 p-3.5 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2.5 ${
                isSuccess
                ? 'bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 text-emerald-700 dark:text-emerald-300'
                : 'bg-rose-50 dark:bg-rose-950/60 border border-rose-200 text-rose-700 dark:text-rose-300'
            }`;
            clientAlertText.textContent = msg;
            clientAlert.classList.remove('hidden');
        }

        // Email / Password Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            loginSubmitBtn.disabled = true;
            loginBtnText.textContent = 'Signing in...';

            try {
                if (window.MeetlyAuth) {
                    const data = await window.MeetlyAuth.signInWithEmail(email, password);
                    if (data && data.session) {
                        window.location.href = '/dashboard';
                        return;
                    }
                }
                // Fallback to standard form post
                loginForm.submit();
            } catch (err) {
                let msg = err.message || 'Invalid email or password.';
                if (msg.toLowerCase().includes('email not confirmed')) {
                    msg = 'Please check your inbox and confirm your email before signing in.';
                } else if (msg.toLowerCase().includes('invalid login credentials')) {
                    msg = 'Invalid email or password.';
                }
                showMessage(msg, false);
                loginSubmitBtn.disabled = false;
                loginBtnText.textContent = 'Sign In to Meetly';
            }
        });

        // Google OAuth Sign In
        if (googleLoginBtn) {
            googleLoginBtn.addEventListener('click', async () => {
                try {
                    googleLoginBtn.disabled = true;
                    googleLoginBtn.querySelector('span').textContent = 'Connecting to Google...';
                    if (window.MeetlyAuth) {
                        await window.MeetlyAuth.signInWithGoogle();
                    } else {
                        window.location.href = '/login?google=1';
                    }
                } catch (err) {
                    showMessage(err.message || 'Failed to start Google sign in.', false);
                    googleLoginBtn.disabled = false;
                    googleLoginBtn.querySelector('span').textContent = 'Continue with Google';
                }
            });
        }

        // Forgot Password Modal
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const forgotPasswordModal = document.getElementById('forgotPasswordModal');
        const cancelForgotBtn = document.getElementById('cancelForgotBtn');
        const sendForgotBtn = document.getElementById('sendForgotBtn');
        const forgotEmail = document.getElementById('forgotEmail');
        const forgotAlert = document.getElementById('forgotAlert');

        if (forgotPasswordBtn && forgotPasswordModal) {
            forgotPasswordBtn.addEventListener('click', () => {
                forgotEmail.value = document.getElementById('loginEmail').value;
                forgotAlert.classList.add('hidden');
                forgotPasswordModal.classList.remove('hidden');
            });
            cancelForgotBtn.addEventListener('click', () => {
                forgotPasswordModal.classList.add('hidden');
            });
            sendForgotBtn.addEventListener('click', async () => {
                const email = forgotEmail.value.trim();
                if (!email) {
                    forgotAlert.className = 'p-3 rounded-xl text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200';
                    forgotAlert.textContent = 'Please enter your email address.';
                    forgotAlert.classList.remove('hidden');
                    return;
                }
                sendForgotBtn.disabled = true;
                sendForgotBtn.textContent = 'Sending...';
                try {
                    if (window.MeetlyAuth) {
                        await window.MeetlyAuth.resetPassword(email);
                    }
                    forgotAlert.className = 'p-3 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
                    forgotAlert.textContent = 'Password reset link sent! Check your email inbox.';
                    forgotAlert.classList.remove('hidden');
                    setTimeout(() => { forgotPasswordModal.classList.add('hidden'); }, 3000);
                } catch (err) {
                    forgotAlert.className = 'p-3 rounded-xl text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200';
                    forgotAlert.textContent = err.message || 'Failed to send reset link.';
                    forgotAlert.classList.remove('hidden');
                } finally {
                    sendForgotBtn.disabled = false;
                    sendForgotBtn.textContent = 'Send Link';
                }
            });
        }
    </script>
</body>
</html>
