<!-- Top App Bar: View Title on left, Theme Toggle and Guest User on right -->
<header id="globalHeaderNav" class="h-16 border-b border-slate-200/80 dark:border-slate-800 bg-white dark:bg-[#0d121f] px-6 sm:px-10 flex items-center justify-between sticky top-0 z-20 shadow-2xs">
    <div class="flex items-center gap-3">
        <h2 id="topNavViewTitle" class="text-sm sm:text-base font-bold text-slate-900 dark:text-white">Dashboard</h2>
    </div>
    <div class="flex items-center gap-3 sm:gap-4">
        <!-- Theme toggle button in top right side -->
        <button id="themeToggleBtn" type="button" aria-label="Toggle theme" class="w-9 h-9 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-700 transition cursor-pointer shadow-xs">
            <svg class="w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>

        <!-- User Profile preview in top right -->
        <div onclick="switchView('viewSettings')" class="flex items-center gap-2.5 pl-3 border-l border-slate-200 dark:border-slate-800 cursor-pointer group">
            <div id="headerUserAvatar" class="avatar-accent w-8 h-8 rounded-full text-white font-bold flex items-center justify-center text-xs shadow-sm transition-colors shrink-0 group-hover:scale-105" style="background-color: var(--theme-accent) !important">
                <span>{{ (user.name or 'G')[0] }}</span>
            </div>
            <span id="headerUserName" class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-white group-hover:text-pink-600 transition">{{ user.name or 'Guest User' }}</span>
        </div>
    </div>
</header>
