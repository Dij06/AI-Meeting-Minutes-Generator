<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating - Meetly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-b from-pink-50/50 via-white to-slate-50 dark:from-[#090d16] dark:via-[#0c101d] dark:to-[#090d16] text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col justify-center items-center px-4">
    <div class="text-center space-y-4 max-w-sm">
        <div class="w-12 h-12 rounded-2xl bg-pink-600 text-white font-extrabold text-xl flex items-center justify-center mx-auto shadow-lg shadow-pink-500/30 animate-pulse">
            M
        </div>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white" id="callbackStatusTitle">Completing Authentication...</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400" id="callbackStatusSub">Connecting your account to Meetly</p>
        <div class="flex items-center justify-center pt-2">
            <svg class="animate-spin w-6 h-6 text-pink-600" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
        </div>
        <div id="errorBox" class="hidden mt-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 text-rose-700 dark:text-rose-300 text-xs text-left"></div>
    </div>

    <script>
        (async function() {
            const statusTitle = document.getElementById('callbackStatusTitle');
            const statusSub = document.getElementById('callbackStatusSub');
            const errorBox = document.getElementById('errorBox');

            try {
                // Fetch Supabase configuration
                const cfgRes = await fetch('/api/auth/config');
                const cfg = await cfgRes.json();
                const supabase = window.supabase.createClient(cfg.supabase_url, cfg.supabase_key);

                // Check for existing session or handle OAuth hash/query
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) throw error;

                if (session) {
                    // Sync session with Flask backend
                    const syncRes = await fetch('/api/auth/session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            access_token: session.access_token,
                            user: session.user
                        })
                    });
                    const syncData = await syncRes.json();
                    if (syncData.status === 'success') {
                        window.location.replace('/dashboard');
                        return;
                    }
                }

                // If not ready immediately, wait for onAuthStateChange
                supabase.auth.onAuthStateChange(async (event, currentSession) => {
                    if (currentSession && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION')) {
                        const syncRes = await fetch('/api/auth/session', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                access_token: currentSession.access_token,
                                user: currentSession.user
                            })
                        });
                        const syncData = await syncRes.json();
                        if (syncData.status === 'success') {
                            window.location.replace('/dashboard');
                        }
                    }
                });

                // Fallback timeout in case of cancelled or failed auth
                setTimeout(() => {
                    if (!session) {
                        statusTitle.textContent = 'Redirecting...';
                        window.location.replace('/login');
                    }
                }, 4000);

            } catch (err) {
                statusTitle.textContent = 'Authentication Failed';
                statusSub.textContent = 'We could not complete your sign-in.';
                errorBox.textContent = err.message || 'An error occurred during authentication.';
                errorBox.classList.remove('hidden');
                setTimeout(() => { window.location.replace('/login'); }, 3000);
            }
        })();
    </script>
</body>
</html>
